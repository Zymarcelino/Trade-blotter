server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for any non-file path so client-side routing
    # works on direct navigation / refresh. The app calls the backend directly
    # (VITE_API_BASE_URL / VITE_WS_URL baked at build time), so nginx only serves
    # static assets - no reverse proxy here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
