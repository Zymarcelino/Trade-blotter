server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for any path that is not a real file so
    # client-side routing works on direct navigation / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to the backend so the SPA is served same-origin.
    # Upgrade/Connection headers are included so the same block tolerates any
    # upgrade traffic; HTTP/1.1 keeps keep-alive working.
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Proxy the WebSocket endpoint to the backend with the upgrade handshake
    # headers required to switch protocols from HTTP to WebSocket.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
