# Trade Blotter - hosted deployment on Render (Blueprint).
#
# WHY RENDER (not Vercel/Cloudflare Workers):
# The app needs a LONG-LIVED, STATEFUL process - it holds persistent WebSocket
# connections and writes to a SQLite file. Serverless/edge platforms run
# ephemeral, stateless instances and cannot hold an open WebSocket or a writable
# DB file. Render runs persistent containers and supports WebSocket upgrades.
#
# ------------------------------------------------------------------------------
# TOPOLOGY: two web services; the frontend calls the backend DIRECTLY
# ------------------------------------------------------------------------------
# On Render, web services are NOT reachable from each other by bare service name
# (that only works on Docker Compose's local network / for Render private
# services). So instead of proxying, the static SPA calls the backend's PUBLIC
# URL directly, using the backend's CORS. The backend URL is baked into the Vite
# build via build args (VITE_API_BASE_URL / VITE_WS_URL), which config/env.ts
# reads. This removes the nginx upstream-resolution / SNI / double-proxy issues.
#
# IMPORTANT: after the FIRST deploy, set the frontend build args below to the
# backend's actual public URL (Render assigns it, e.g.
# https://trade-blotter-backend-XXXX.onrender.com), then redeploy the frontend.
# The values below are the known backend URL from the initial deploy.
#
# PERSISTENCE: a 1GB disk is mounted at /data (DB_PATH=/data/trades.db) so trades
# survive restarts/redeploys. Remove the disk block for an ephemeral fallback -
# the app re-seeds 500 trades on empty startup.

services:
  # ---- Backend: Fastify + SQLite + WebSocket (public API + WS) ---------------
  - type: web
    name: trade-blotter-backend
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/trades
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/trades.db
      # The SPA calls the backend cross-origin, so CORS must allow it. '*' is
      # fine for a demo; set to the frontend's public URL to lock it down.
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: trade-blotter-data
      mountPath: /data
      sizeGB: 1

  # ---- Frontend: static SPA (nginx) that calls the backend's public URL ------
  - type: web
    name: trade-blotter-frontend
    env: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Baked into the Vite build (build-time). Point these at the backend's
      # PUBLIC URL. Update if Render assigns the backend a different host.
      - key: VITE_API_BASE_URL
        value: https://trade-blotter-backend-02lg.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://trade-blotter-backend-02lg.onrender.com/ws
