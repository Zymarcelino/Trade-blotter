# Trade Blotter - hosted deployment on Render (Blueprint).
#
# WHY RENDER (not Vercel/Cloudflare Workers):
# The app needs a LONG-LIVED, STATEFUL process - it holds persistent WebSocket
# connections and writes to a SQLite file. Serverless/edge platforms run
# ephemeral, stateless instances and cannot hold an open WebSocket or a writable
# DB file, so they are unsuitable. Render runs persistent containers and supports
# WebSocket upgrades. (Requirement 15.9)
#
# ------------------------------------------------------------------------------
# TOPOLOGY: two web services, the FRONTEND is the public URL
# ------------------------------------------------------------------------------
# - backend  : Docker web service running Fastify + SQLite + the WebSocket
#              server. Binds 0.0.0.0 on PORT (see backend/src/server.ts). It is
#              reachable from the frontend over Render's private network at
#              http://trade-blotter-backend:3000. (Requirement 15.10)
# - frontend : Docker web service (nginx) that serves the built SPA and
#              reverse-proxies /api and /ws to the backend's INTERNAL address.
#              This is the URL people visit; everything is same-origin, so there
#              is no CORS and the SPA needs no rebuild (config/env.ts resolves
#              /api/v1 and ws(s)://<host>/ws at runtime). (Requirements 15.7, 15.8)
#
# The frontend nginx upstream is parametrised via BACKEND_ORIGIN (envsubst in the
# nginx image). Locally (Docker Compose) it defaults to http://backend:3000; here
# it is set to the backend's internal Render URL.
#
# PERSISTENCE (Requirement 15.11): a 1GB disk is mounted at /data and
# DB_PATH=/data/trades.db, so trades survive restarts/redeploys. Remove the disk
# block for the ephemeral fallback - the app re-seeds 500 trades on empty
# startup, but user-created trades then do not survive a restart. (Req 15.12)

services:
  # ---- Backend: Fastify + SQLite + WebSocket (private, reached by the frontend)
  - type: web
    name: trade-blotter-backend
    env: docker
    plan: starter                 # smallest paid plan that allows a persistent disk
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/trades
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/trades.db
      # Same-origin via the frontend proxy, so CORS is not exercised by the SPA.
      # Left permissive for any direct API access.
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: trade-blotter-data
      mountPath: /data
      sizeGB: 1

  # ---- Frontend: nginx serving the SPA + proxying /api and /ws (PUBLIC URL) ----
  - type: web
    name: trade-blotter-frontend
    env: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Point nginx at the backend's INTERNAL Render address. Service-to-service
      # traffic resolves by service name on Render's private network. If your
      # backend listens on a different port, match it here.
      - key: BACKEND_ORIGIN
        value: http://trade-blotter-backend:3000
